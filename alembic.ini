[alembic]
script_location = alembic

# No file_template: Alembic's default is %(rev)s_%(slug)s, so the sequential rev_id
# assigned in env.py ("000001") produces 000001_create_users_table.py by itself.

# REQUIRED. Without it, `alembic revision -m "..."` (no --autogenerate) does not run
# env.py, the numbering hook never fires, and the migration gets a random hex id —
# silently breaking the sequence. (alembic/command.py: env.py runs only for
# autogenerate or when revision_environment is true. Read on Alembic 1.19.2.)
revision_environment = true

# The database URL is not set here: env.py takes it from the service settings
# (POSTGRES__*), so there is one place that says where the database is.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
