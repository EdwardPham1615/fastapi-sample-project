// The users domain over gRPC. Boilerplate: one RPC, to show where servicers live and
// how they share the repository and the not-found rule with the HTTP routes.
syntax = "proto3";

package users.v1;

service UserService {
  rpc GetProfile(GetProfileRequest) returns (UserProfile);
}

message GetProfileRequest {
  string user_id = 1;
}

message UserProfile {
  string id = 1;
  string oidc_provider_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  int32 status = 6;
  int64 updated_at = 7;
}
